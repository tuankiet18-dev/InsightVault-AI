name: insightvault-ai

services:
  frontend:
    build:
      context: ../frontend
      target: dev
    container_name: insightvault_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5126/api}
      VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ../backend/InsightVault.API
    container_name: insightvault_backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-insightvault};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      Jwt__Issuer: ${JWT_ISSUER:-InsightVault.API}
      Jwt__Audience: ${JWT_AUDIENCE:-InsightVault.Frontend}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in infra/.env}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Cors__AllowedOrigins__0: ${FRONTEND_ALLOWED_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${FRONTEND_ALLOWED_ORIGIN_HTTPS:-https://localhost:5173}
      MinIO__Endpoint: minio:9000
      MinIO__PublicEndpoint: localhost:9000
      MinIO__BucketName: insightvault-documents
      MinIO__PresignedUploadMinutes: 10
      MinIO__UseSsl: false
      MinIO__PublicUseSsl: false
      MinIO__AccessKey: ${MINIO_ROOT_USER:-admin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER:-admin}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in infra/.env}
      RabbitMQ__DocumentProcessingQueue: document-processing
      RabbitMQ__AiJobsQueue: ai-jobs
      RabbitMQ__EmailQueue: emails
      RabbitMQ__EmailMaxDeliveryAttempts: ${RABBITMQ_EMAIL_MAX_DELIVERY_ATTEMPTS:-3}
      RabbitMQ__EmailRetryDelaySeconds: ${RABBITMQ_EMAIL_RETRY_DELAY_SECONDS:-5}
      AIService__BaseUrl: http://ai-service:8000
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__SenderName: ${SMTP_SENDER_NAME:-InsightVault AI}
      Smtp__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      PayOS__Enabled: ${PAYOS_ENABLED:-false}
      PayOS__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOS__ApiKey: ${PAYOS_API_KEY:-}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      PayOS__ReturnUrl: ${PAYOS_RETURN_URL:-http://localhost:5173/billing/return}
      PayOS__CancelUrl: ${PAYOS_CANCEL_URL:-http://localhost:5173/billing/return}
      PayOS__CheckoutExpiryMinutes: ${PAYOS_CHECKOUT_EXPIRY_MINUTES:-15}
    ports:
      - "5126:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  ai-service:
    build:
      context: ../ai-service
    container_name: insightvault_ai_service
    env_file:
      - ../ai-service/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-insightvault}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: insightvault_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-insightvault}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-insightvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: insightvault_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: insightvault_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in infra/.env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  rabbitmq_data:
