name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Python for smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run UI smoke test
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          python test_knowledge_ide.py

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/InsightVault.API/InsightVault.API.csproj

      - name: Build
        run: dotnet build backend/InsightVault.API/InsightVault.API.csproj --no-restore --configuration Release

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check imports & syntax
        run: |
          python -c "
          import fastapi, pydantic, uvicorn, dotenv, google.generativeai
          import fitz, docx, tiktoken, minio, psycopg2, pgvector, numpy
          compile(open('main.py', encoding='utf-8').read(), 'main.py', 'exec')
          compile(open('services/extractor.py', encoding='utf-8').read(), 'services/extractor.py', 'exec')
          compile(open('services/chunker.py', encoding='utf-8').read(), 'services/chunker.py', 'exec')
          compile(open('services/embedder.py', encoding='utf-8').read(), 'services/embedder.py', 'exec')
          compile(open('services/vector_store.py', encoding='utf-8').read(), 'services/vector_store.py', 'exec')
          compile(open('services/summarizer.py', encoding='utf-8').read(), 'services/summarizer.py', 'exec')
          compile(open('services/rag_service.py', encoding='utf-8').read(), 'services/rag_service.py', 'exec')
          compile(open('services/compare_service.py', encoding='utf-8').read(), 'services/compare_service.py', 'exec')
          compile(open('services/report_service.py', encoding='utf-8').read(), 'services/report_service.py', 'exec')
          print('AI service: all imports and syntax OK')
          "
